<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="지금 여기"><link rel="manifest" href="manifest.json"><title>지금 여기서 뭐 하지?</title><style>
 :root{--bg:#FFFBF7;--fg:#2B2B2B;--card:#fff;--sub:#666;--pt:#D94F4F;--bar-height:calc(80px + env(safe-area-inset-bottom))}
body.night{--bg:#141826;--fg:#EEE;--card:#1F2438;--sub:#B4BCC8}
*{box-sizing:border-box}body{margin:0;font-family:Pretendard,-apple-system,sans-serif;background:var(--bg);color:var(--fg);font-size:15px}button{font:inherit;cursor:pointer}button:focus-visible,a:focus-visible,.card:focus-visible{outline:2px solid var(--pt);outline-offset:3px}
.map-wrap{position:relative;height:clamp(200px,32vh,280px)}iframe{width:100%;height:100%;border:0;display:block}.map-loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(100deg,var(--card) 25%,var(--bg) 45%,var(--card) 65%);background-size:200% 100%;animation:shimmer 1.5s linear infinite;pointer-events:none}.map-loading[hidden]{display:none}.map-loading button{pointer-events:auto;min-height:44px;padding:0 20px;border:1px solid var(--sub);border-radius:12px;background:var(--card);color:var(--fg)}@keyframes shimmer{to{background-position:-200% 0}}@media(prefers-reduced-motion:reduce){.map-loading{animation:none}}
.sheet{background:var(--bg);border-radius:16px 16px 0 0;position:relative;padding:16px}.heading{display:flex;align-items:center;justify-content:space-between;gap:8px}h1{font-size:20px;margin:0 0 4px}.sub{color:var(--sub);font-size:13px}.subtitle{white-space:nowrap;font-size:12px}#theme{min-width:44px;min-height:44px;border:1px solid #8884;border-radius:12px;background:var(--card);color:var(--fg);font-size:12px;padding:4px 8px}
.row{display:flex;gap:8px;overflow-x:auto;margin:12px 0}.mood,.chip{flex:none;border:1px solid #8884;background:var(--card);color:var(--fg);border-radius:22px;min-height:44px;padding:0 14px;font-size:14px}.mood{background:#FDECEA;color:#2B2B2B}.mood.on,.chip.on,.toggle:has(input:checked){background:#2B2B2B;color:#fff;border-color:transparent}.category-wrap{position:relative}.category-wrap:after{content:"";position:absolute;right:0;top:0;bottom:0;width:24px;background:linear-gradient(to right,transparent,var(--bg));pointer-events:none}#chips{padding-right:24px}.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:12px 0}.segments{display:flex;border:1px solid #8884;border-radius:22px;overflow:hidden}.segments button{border:0;border-radius:0;padding:0 12px}.toggle{position:relative;display:flex;align-items:center;cursor:pointer}.toggle input{position:absolute;opacity:0;width:1px;height:1px}.toggle:focus-within{outline:2px solid var(--pt);outline-offset:2px}
#list{padding-bottom:var(--bar-height)}.card{background:var(--card);border-radius:16px;padding:12px;margin:8px 0;cursor:pointer;scroll-margin-bottom:var(--bar-height)}.card-main{display:flex;gap:10px;align-items:center}.th{width:40px;height:40px;border-radius:10px;flex:none;display:flex;align-items:center;justify-content:center;font-size:26px}.info{min-width:0;flex:1}.card .n{font-size:16px;line-height:1.4;word-break:keep-all;font-weight:600;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.meta{font-size:14px;line-height:1.6;color:var(--sub);margin-top:4px}.rank{display:inline-block;font-size:12px;font-weight:600;padding:2px 6px;border-radius:20px;background:#FDECEA;color:#873737;margin-top:4px}.card a{flex:none;display:flex;align-items:center;justify-content:center;min-width:64px;min-height:48px;background:#D94F4F;color:#fff;text-decoration:none;padding:8px;border-radius:10px;font-size:14px;font-weight:700}.details{border-top:1px solid #8884;margin-top:12px;padding-top:12px;line-height:1.7}.details[hidden]{display:none}
.bottom-bar{position:fixed;z-index:10;left:0;right:0;bottom:0;height:var(--bar-height);padding:4px 16px calc(4px + env(safe-area-inset-bottom));background:var(--card);border-top:1px solid #8884;text-align:center}#rand{width:100%;height:48px;border:0;border-radius:12px;background:var(--pt);color:#fff;font-size:16px;font-weight:700}.bottom-sub{font-size:12px;line-height:23px;color:var(--sub)}
.b{display:inline-block;font-size:13px;font-weight:600;padding:2px 6px;border-radius:6px}.bo{background:#1B7A5515;color:#1B7A55}.bc,.bt{background:#B33A3A15;color:#B33A3A}.bu{background:#8883;color:var(--sub)}.hl{outline:2px solid var(--pt)}#dataDate{text-align:center;font-size:12px;margin:4px 0;color:var(--sub)}
</style></head><body>
<div class="map-wrap" aria-busy="true"><iframe id="map" title="주변 장소 지도"></iframe><div class="map-loading" id="mapLoading" role="status" aria-label="지도 불러오는 중"><button id="mapRetry" hidden onclick="retryMap()">다시 시도</button></div></div>
<div class="sheet"><div class="heading"><h1>지금 여기서 뭐 하지?</h1><button id="theme" onclick="cycleTheme()" aria-label="화면 모드: 자동">🌙 자동</button></div>
<div class="sub subtitle">간다 호텔 기준 · 도보 시간은 추정</div>
<div class="row" id="moods"></div><div class="category-wrap"><div class="row" id="chips"></div></div>
<div class="controls"><div class="segments" role="group" aria-label="정렬"><button class="chip" id="sh" onclick="sort='hot';render()">인기순</button><button class="chip" id="sn" onclick="sort='near';render()">가까운 순</button></div><label class="chip toggle"><input type="checkbox" id="openOnly" onchange="render()"><span>● 지금 열린 곳</span></label></div>
<div id="dataDate"></div><div id="list"></div></div>
<div class="bottom-bar"><button id="rand" onclick="rand()">🔥 지금 갈 만한 곳</button><div class="bottom-sub">도보 15분 이내 · 영업 중</div></div>
<script>
const C={food:["🍜 먹거리","#C8705A"],sightseeing:["⛩️ 구경거리","#8A9A7B"],onsen_rest:["♨️ 온천·휴식","#E2B76A"],shopping:["🛍️ 쇼핑","#4E5A8C"],night_view:["🌃 야경","#6E4E6E"],cafe:["☕ 카페","#EADCC2"]};
let P=[];
const M={"배고파":["food","cafe"],"피곤해":["onsen_rest","cafe"],"비 와":["shopping","onsen_rest","cafe"],"밤이야":["night_view","food"]};
let sort="hot";
const D=["sun","mon","tue","wed","thu","fri","sat"];
function tm(s){const[a,b]=s.split(":");return +a*60+ +b}
function st(p){if(p.tc)return{t:"tc"};if(!p.h)return{t:"u"};const n=new Date(),m=n.getHours()*60+n.getMinutes(),d=n.getDay();
const td=p.h[D[d]],yd=p.h[D[(d+6)%7]];if(td==null)return{t:"u"};
for(const[o,c]of td){if(m>=tm(o)&&m<tm(c))return{t:"o",c:tm(c)>=1440?(tm(c)==1440?null:String(tm(c)/60-24|0).padStart(2,"0")+c.slice(2)):c}}
for(const[o,c]of(yd||[])){if(tm(c)>1440&&m+1440<tm(c))return{t:"o",c:String(tm(c)/60-24|0).padStart(2,"0")+c.slice(2)}}
return{t:"c"}}
function badge(x){return x.t=="o"?'<span class="b bo">● 영업 중</span>':x.t=="c"?'<span class="b bc">✕ 영업 끝</span>':x.t=="tc"?'<span class="b bt">✕ 임시 휴업</span>':'<span class="b bu">영업시간 확인 필요</span>'}
const ord=x=>x.t=="tc"?3:(openOnly.checked&&x.t!="o")?(x.t=="u"?1:2):0;

let mood=null,cat=null,pick=null,selected=null;
let themeMode="자동";try{themeMode=localStorage.getItem("themeMode")||"자동"}catch{}if(!["자동","낮","밤"].includes(themeMode))themeMode="자동";
function applyTheme(){const h=new Date().getHours();document.body.classList.toggle("night",themeMode=="밤"||(themeMode=="자동"&&(h>=18||h<6)));theme.textContent="🌙 "+themeMode;theme.setAttribute("aria-label","화면 모드: "+themeMode)}
function cycleTheme(){themeMode=["자동","낮","밤"][( ["자동","낮","밤"].indexOf(themeMode)+1)%3];try{localStorage.setItem("themeMode",themeMode)}catch{}applyTheme()}applyTheme();setInterval(applyTheme,60000);
const mapFrame=document.getElementById("map");let mapTimer;
function startMapLoading(){clearTimeout(mapTimer);mapLoading.hidden=false;mapRetry.hidden=true;mapFrame.parentElement.setAttribute("aria-busy","true");mapTimer=setTimeout(()=>{mapRetry.hidden=false},8000)}
mapFrame.addEventListener("load",()=>{clearTimeout(mapTimer);mapLoading.hidden=true;mapFrame.parentElement.setAttribute("aria-busy","false")});
const map=q=>{startMapLoading();document.getElementById("map").src="https://maps.google.com/maps?q="+encodeURIComponent(q)+"&z=15&output=embed"};
function retryMap(){const src=mapFrame.src;startMapLoading();mapFrame.src=src}
function selectCard(i){const p=P[i];selected=selected===p?null:p;map(p.lat+","+p.lng);render();document.getElementById("card-"+i)?.focus({preventScroll:true})}
function cardKey(event,i){if(event.target!==event.currentTarget)return;if(event.key=="Enter"||event.key==" "){event.preventDefault();selectCard(i)}}
const fmt=n=>n==null?"-":Number(n).toLocaleString("ko-KR");
const gl=q=>"https://www.google.com/maps/dir/?api=1&travelmode=walking&destination="+encodeURIComponent(q+" Tokyo");
function render(){
moods.innerHTML=Object.keys(M).map(k=>`<button class="mood ${k==mood?'on':''}" onclick="mood=mood=='${k}'?null:'${k}';cat=null;render()">${k}</button>`).join("");
chips.innerHTML=Object.entries(C).filter(([k])=>!mood||M[mood].includes(k)).map(([k,[n,c]])=>`<button class="chip ${k==cat?'on':''}" onclick="cat=cat=='${k}'?null:'${k}';render()">${n}</button>`).join("");
sh.className="chip "+(sort=="hot"?"on":"");sn.className="chip "+(sort=="near"?"on":"");sh.setAttribute("aria-pressed",sort=="hot");sn.setAttribute("aria-pressed",sort=="near");
const L=P.filter(p=>(p.w<=20||p.ko.includes("기타노마루"))&&(!cat||p.k==cat)&&(!mood||M[mood].includes(p.k))).map(p=>(p.st=st(p),p)).sort((a,b)=>ord(a.st)-ord(b.st)||(sort=="hot"?(b.s-a.s):(a.w-b.w))).filter(p=>!(openOnly.checked&&p.st.t!="o"));
list.innerHTML=L.map(p=>{const i=P.indexOf(p);return `<div id="card-${i}" class="card ${p==selected||p==pick?'hl':''}" tabindex="0" aria-expanded="${p===selected}" aria-controls="details-${i}" onclick="selectCard(${i})" onkeydown="cardKey(event,${i})"><div class="card-main"><div class="th" style="background:${C[p.k][1]}">${C[p.k][0].split(" ")[0]}</div><div class="info"><div class="n">${p.ko}</div><div class="meta">도보 ${p.w}분 · ${p.st.t=="o"&&p.st.c&&p.st.c!="24:00"?p.st.c+" 마감":badge(p.st)}</div><span class="rank">🔥 ${C[p.k][0].split(" ")[1]} ${p.r}위</span></div><a href="https://www.google.com/maps/dir/?api=1&travelmode=walking&destination=${p.lat},${p.lng}" target="_blank" rel="noopener" onclick="event.stopPropagation()">길찾기</a></div><div id="details-${i}" class="details sub" ${p===selected?'':'hidden'}>${badge(p.st)} ${p.ko.includes("사바쇼")?'<span class="b bu">현금만</span>':''}${p.ko.includes("산코엔")&&new Date().getDay()==0?'<span class="b bu">일요일 휴무일 수 있음</span>':''}<div>${p.g!=null?'리뷰 '+fmt(p.g)+(p.gr?' ★'+p.gr:'')+' (구글 지도) · ':''}${p.tb!=null?'타베로그 리뷰 '+fmt(p.tb)+' · ':''}X 7일 ${fmt(p.x)}건 (10/22)</div>${p.warn?'<div>ⓘ 언급 수가 부정확할 수 있어요</div>':''}</div></div>`}).join("")||'<p class="sub">조건에 맞는 곳이 없어요.</p>'+(openOnly.checked?'<button class="chip" onclick="openOnly.checked=false;render()">필터 해제</button>':'')}

function rand(){const c=P.filter(p=>p.w<=15&&st(p).t=="o"&&(!cat||p.k==cat)&&(!mood||M[mood].includes(p.k))).sort((a,b)=>b.s-a.s);if(!c.length)return alert("지금 15분 안에 열린 곳이 없어요");pick=c[0];sort="hot";render();map(pick.lat+","+pick.lng);document.getElementById("card-"+P.indexOf(pick)).scrollIntoView({behavior:"smooth",block:"center"})}
map("Hotel Niwa Tokyo");fetch("data.json?"+Date.now()).then(r=>r.json()).then(d=>{P=Array.isArray(d)?d:d.places;if(d.updated){const t=new Date(d.updated),k=x=>new Date(x).toLocaleDateString("ko-KR",{timeZone:"Asia/Tokyo"}),old=k(t)!=k(new Date()),u=document.getElementById("dataDate");u.innerHTML=(old?`<span style="background:#888;color:#fff;border-radius:8px;padding:1px 8px">어제 데이터</span> `:"")+`${d.updated.slice(5,10).replace("-","/")} 기준 정보`}render()});
</script></body></html>
