name: collect
on:
  schedule: [{cron: "0 22 * * *"}]   # 매일 07:00 KST
  workflow_dispatch:
permissions: {contents: write}
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 collect_places.py
        env: {GOOGLE_PLACES_API_KEY: "${{ secrets.GOOGLE_PLACES_API_KEY }}"}
      - run: |
          git config user.name bot; git config user.email bot@users.noreply.github.com
          git add data.json; git diff --cached --quiet || (git commit -m "data $(date -u +%F)" && git push)
